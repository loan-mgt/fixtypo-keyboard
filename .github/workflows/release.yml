name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          echo "$KEYSTORE_FILE" | base64 --decode > keystore.raw
          STORE_TYPE=""
          if keytool -list -keystore keystore.raw -storepass "$KEYSTORE_PASSWORD" -storetype jks >/dev/null 2>&1; then
            STORE_TYPE="jks"
          elif keytool -list -keystore keystore.raw -storepass "$KEYSTORE_PASSWORD" -storetype pkcs12 >/dev/null 2>&1; then
            STORE_TYPE="pkcs12"
          fi
          if [ -z "$STORE_TYPE" ]; then
            echo "ERROR: Cannot read keystore - check KEYSTORE_FILE, KEYSTORE_PASSWORD, and KEYSTORE_ALIAS"
            exit 1
          fi
          echo "Detected keystore type: $STORE_TYPE"
          if [ "$STORE_TYPE" = "pkcs12" ]; then
            keytool -importkeystore \
              -srckeystore keystore.raw -srcstoretype pkcs12 \
              -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEYSTORE_ALIAS" \
              -destkeystore key.jks -deststoretype jks \
              -deststorepass "$KEYSTORE_PASSWORD" -destalias "$KEYSTORE_ALIAS" \
              -srckeypass "$KEY_PASSWORD" -destkeypass "$KEY_PASSWORD"
            rm -f keystore.raw
          else
            mv keystore.raw key.jks
          fi
          echo "storePassword=$KEYSTORE_PASSWORD" > keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEYSTORE_ALIAS" >> keystore.properties
          echo "storeFile=key.jks" >> keystore.properties

      - name: Get version code
        run: echo "VERSION_CODE=$(git rev-list --first-parent --count HEAD)" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleStableRelease -s
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: Rename APK
        run: |
          mv build/outputs/apk/stable/release/latinime-stable-release.apk \
             ./keyboard-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Keyboard ${{ github.ref_name }}
          files: ./keyboard-${{ github.ref_name }}.apk
          draft: true
          generate_release_notes: true
